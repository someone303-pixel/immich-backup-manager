<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Immich Backup · Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f12;
    --surface: #13161b;
    --border: #1e2329;
    --accent: #00e5a0;
    --accent-dim: rgba(0,229,160,0.12);
    --text: #c8d0dc;
    --text-dim: #5a6472;
    --error: #ff4f4f;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(0,229,160,0.06) 0%, transparent 70%);
  }

  .login-wrap {
    width: 100%;
    max-width: 360px;
    padding: 2rem;
    animation: fadeUp 0.4s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo {
    font-family: var(--mono);
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 2.5rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .logo::before {
    content: '';
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--accent);
    animation: pulse 2s ease infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  h1 {
    font-family: var(--mono);
    font-size: 1.5rem;
    font-weight: 600;
    color: #fff;
    margin-bottom: 0.4rem;
    letter-spacing: -0.02em;
  }

  .subtitle {
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-bottom: 2rem;
    font-weight: 300;
  }

  .field {
    margin-bottom: 1rem;
  }

  label {
    display: block;
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 0.5rem;
  }

  input[type="password"] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.9rem;
    padding: 0.7rem 0.9rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input[type="password"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  .error-msg {
    font-size: 0.78rem;
    color: var(--error);
    font-family: var(--mono);
    margin-bottom: 1rem;
    padding: 0.5rem 0.8rem;
    background: rgba(255,79,79,0.08);
    border: 1px solid rgba(255,79,79,0.2);
    border-radius: 4px;
  }

  button[type="submit"] {
    width: 100%;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.75rem;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 0.5rem;
  }

  button[type="submit"]:hover { opacity: 0.88; }
  button[type="submit"]:active { transform: scale(0.98); }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="logo">Immich Backup Manager</div>
  <h1>Zugang</h1>
  <p class="subtitle">Raspberry Pi · Backup-Steuerung</p>

  {% if error %}
  <div class="error-msg">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/login">
    <div class="field">
      <label for="password">Passwort</label>
      <input type="password" id="password" name="password" autofocus autocomplete="current-password">
    </div>
    <button type="submit">Anmelden</button>
  </form>
</div>
</body>
</html>
